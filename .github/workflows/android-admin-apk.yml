name: Android Admin APK Preview

on:
  push:
    branches:
      - android-admin-apk-2026-09-11
    paths:
      - "android-admin-app/**"
      - ".github/workflows/android-admin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build preview APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: rohilla-drive-admin-preview-apk
          path: android-admin-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
